server {
    listen 80;
    # Use Docker's internal DNS resolver so nginx re-resolves the backend
    # hostname on each request instead of caching the IP at startup.
    # This prevents 502s after backend container restarts.
    resolver 127.0.0.11 valid=10s;
    set $backend_upstream http://backend:1337;
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
    location /api {
        proxy_pass $backend_upstream;
    }
}
